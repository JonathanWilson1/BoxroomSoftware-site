<style>
:root{--green:#39ff6a;--muted:#2f6b3d;--glow:0 0 4px rgba(57,255,106,.95),0 0 14px rgba(57,255,106,.55),0 0 34px rgba(57,255,106,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:16px;overflow:hidden;
  font:14px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--green);animation:flicker 6s infinite}

@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.82}94%{opacity:1}96%{opacity:.9}97%{opacity:1}}

/* cube */
.stage{perspective:800px;display:grid;place-items:center;width:260px;height:260px;filter:drop-shadow(0 0 8px rgba(57,255,106,.35))}
.cube{--s:130px;position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;animation:tumble 18s linear infinite}
.face{position:absolute;width:var(--s);height:var(--s);border:1.5px solid var(--green);box-shadow:var(--glow),inset 0 0 18px rgba(57,255,106,.18);
  background:repeating-linear-gradient(0deg,rgba(57,255,106,.05) 0 1px,transparent 1px 4px)}
.front{transform:translateZ(calc(var(--s)/2))}
.back{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.right{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.left{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.top{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.bottom{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
@keyframes tumble{from{transform:rotateX(-25deg) rotateY(0) rotateZ(8deg)}50%{transform:rotateX(-40deg) rotateY(180deg) rotateZ(-8deg)}to{transform:rotateX(-25deg) rotateY(360deg) rotateZ(8deg)}}

/* email with glitch + cursor */
a{position:relative;color:var(--green);text-decoration:none;text-shadow:var(--glow);letter-spacing:.04em}
a::after{content:"";display:inline-block;width:.6em;height:1.05em;margin-left:6px;vertical-align:-3px;background:var(--green);box-shadow:var(--glow);animation:blink 1s steps(1) infinite}
a:hover{background:var(--green);color:#000;text-shadow:none}
a:focus-visible{outline:1px dashed var(--green);outline-offset:6px}
.glitch{animation:glitch 5s infinite}
@keyframes blink{50%{opacity:0}}
@keyframes glitch{0%,90%,100%{transform:none;text-shadow:var(--glow)}
  91%{transform:translate(-2px,0) skewX(-8deg);text-shadow:-2px 0 #ff2a6d,2px 0 #05d9e8}
  92%{transform:translate(2px,1px);text-shadow:2px 0 #ff2a6d,-2px 0 #05d9e8}
  93%{transform:none}}
.prompt{color:var(--muted);margin-right:8px}

footer{position:fixed;bottom:16px;left:16px;right:16px;text-align:center;font-size:11px;color:var(--muted);z-index:6}

@media (prefers-reduced-motion:reduce){
  body,.glitch,a::after{animation:none}
  .cube{animation:none;transform:rotateX(-25deg) rotateY(35deg)}}
</style></head><body>
